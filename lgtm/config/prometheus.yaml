# Prometheus for the local LGTM stack (`pnpm run server:lgtm`).
#
# Every scrape target is a container in this stack. There is no synthetic
# exporter and no metrics generator: the stack measures itself, so the numbers
# on a panel move because Grafana ran a query or Loki ingested a line.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    stack: lgtm

scrape_configs:
  # `service_name` mirrors the label Loki puts on the same container's logs and
  # the `service.name` resource attribute on its traces, so metrics, logs and
  # traces for one service can be lined up by a single label.
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service_name: prometheus

  - job_name: grafana
    static_configs:
      - targets: ['grafana:3000']
        labels:
          service_name: grafana

  - job_name: loki
    static_configs:
      - targets: ['loki:3100']
        labels:
          service_name: loki

  - job_name: tempo
    static_configs:
      - targets: ['tempo:3200']
        labels:
          service_name: tempo

  - job_name: alloy
    static_configs:
      - targets: ['alloy:12345']
        labels:
          service_name: alloy

# Prometheus is a traced service too, not just the metrics store.
tracing:
  endpoint: tempo:4317
  insecure: true
  sampling_fraction: 1
